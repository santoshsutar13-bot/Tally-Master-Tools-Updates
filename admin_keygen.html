<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SS Tools - Mobile License Generator</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
  <script src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl-fast.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; min-height: 100vh; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .card { background-color: #111827; border: 1px solid #1f2937; border-radius: 16px; width: 100%; max-width: 480px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 20px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .header p { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    input, select { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; font-size: 14px; color: #f8fafc; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #38bdf8; }
    .type-radios { display: flex; gap: 10px; margin-top: 4px; }
    .radio-btn { flex: 1; text-align: center; background: #1e293b; border: 1px solid #334155; padding: 10px; border-radius: 8px; font-size: 13px; cursor: pointer; color: #94a3b8; }
    .radio-btn.active { background: #0369a1; border-color: #38bdf8; color: #ffffff; font-weight: bold; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #2563eb); color: white; box-shadow: 0 4px 14px 0 rgba(2, 132, 199, 0.4); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-whatsapp { background: #16a34a; color: white; margin-top: 8px; }
    .btn-copy { background: #334155; color: #f1f5f9; margin-top: 8px; }
    .result-box { margin-top: 20px; background: #0a0e17; border: 1px dashed #334155; border-radius: 10px; padding: 14px; display: none; }
    .result-box.show { display: block; }
    .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .result-header span { font-size: 12px; color: #94a3b8; }
    .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: bold; }
    .status-syncing { background: #854d0e; color: #fef08a; }
    .status-synced { background: #14532d; color: #86efac; }
    .key-display { word-break: break-all; font-family: "Courier New", monospace; font-size: 12px; color: #4ade80; background: #000; padding: 10px; border-radius: 6px; border: 1px solid #1e293b; max-height: 90px; overflow-y: auto; }
    #qrcode { display: flex; justify-content: center; margin: 15px 0; }
    #qrcode img { border-radius: 8px; border: 4px solid white; }
    .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #64748b; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>📱 SS Tools License Generator</h1>
    <p>Mobile Ed25519 Keygen & Cloud Auto-Sync</p>
  </div>

  <div class="form-group">
    <label>License Type</label>
    <div class="type-radios">
      <div class="radio-btn active" id="btn-full" onclick="setType('FULL')">⭐ Full (1 Year)</div>
      <div class="radio-btn" id="btn-trial" onclick="setType('TRIAL')">⏳ Trial (3 Days)</div>
    </div>
  </div>

  <div class="form-group">
    <label for="machineId">Client Machine ID *</label>
    <input type="text" id="machineId" placeholder="e.g. BA6111136E932AFD3AC5" required style="text-transform: uppercase;">
  </div>

  <div class="form-group">
    <label for="clientEmail">Client Email (Optional)</label>
    <input type="email" id="clientEmail" placeholder="client@example.com">
  </div>

  <div class="form-group">
    <label for="expiryDate">Expiry Date (YYYY-MM-DD) *</label>
    <input type="date" id="expiryDate" required>
  </div>

  <button class="btn btn-primary" onclick="generateLicense()">⚡ Generate & Auto-Save</button>

  <div class="result-box" id="resultBox">
    <div class="result-header">
      <span>Generated License Key:</span>
      <span class="status-badge" id="syncStatus">⏳ Syncing...</span>
    </div>
    <div class="key-display" id="keyDisplay"></div>
    
    <div id="qrcode"></div>

    <button class="btn btn-copy" onclick="copyKey()">📋 Copy License Key</button>
    <button class="btn btn-whatsapp" onclick="shareWhatsApp()">💬 Share on WhatsApp</button>
  </div>
</div>

<div class="footer">
  Santosh Sutar Tools &copy; 2026 | Private Ed25519 System
</div>

<script>
  // Private Key Seed (32 bytes raw)
  const PRIV_KEY_HEX = "509b2ad72f8813ba6b438794b6d125d8cf216d42b40f791457f4750981b279c3";
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx54kPaoh8MzoEb9BybFUraYHmt8uiuv7kBdDuR0ZUveebXedZ-zTcBCRzg2WClAK73/exec";

  let selectedType = "FULL";

  // Initialize Default Expiry (1 Year from today)
  function initDates() {
    const today = new Date();
    today.setFullYear(today.getFullYear() + 1);
    document.getElementById('expiryDate').value = today.toISOString().split('T')[0];
  }
  initDates();

  function setType(type) {
    selectedType = type;
    document.getElementById('btn-full').classList.toggle('active', type === 'FULL');
    document.getElementById('btn-trial').classList.toggle('active', type === 'TRIAL');

    const today = new Date();
    if (type === 'TRIAL') {
      today.setDate(today.getDate() + 3);
    } else {
      today.setFullYear(today.getFullYear() + 1);
    }
    document.getElementById('expiryDate').value = today.toISOString().split('T')[0];
  }

  function hexToUint8Array(hexString) {
    return new Uint8Array(hexString.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
  }

  function base64Encode(bytes) {
    let binary = '';
    const len = bytes.byteLength;
    for (let i = 0; i < len; i++) {
      binary += String.fromCharCode(bytes[i]);
    }
    return window.btoa(binary);
  }

  let lastGeneratedKey = "";

  async function generateLicense() {
    const mid = document.getElementById('machineId').value.trim().toUpperCase();
    const email = document.getElementById('clientEmail').value.trim();
    const expiry = document.getElementById('expiryDate').value.trim();

    if (!mid) {
      alert("Please enter the Client Machine ID.");
      return;
    }
    if (!expiry) {
      alert("Please choose an Expiry Date.");
      return;
    }

    // 1. Build Payload
    const payload = email ? `${selectedType}|${expiry}|${mid}|${email}` : `${selectedType}|${expiry}|${mid}`;
    const payloadBytes = new TextEncoder().encode(payload);

    // 2. Sign using tweetnacl Ed25519
    const seed = hexToUint8Array(PRIV_KEY_HEX);
    const keyPair = nacl.sign.keyPair.fromSeed(seed);
    const signature = nacl.sign.detached(payloadBytes, keyPair.secretKey);

    const payloadB64 = base64Encode(payloadBytes);
    const sigB64 = base64Encode(signature);
    lastGeneratedKey = `${payloadB64}.${sigB64}`;

    // 3. Display Result
    document.getElementById('keyDisplay').innerText = lastGeneratedKey;
    document.getElementById('resultBox').classList.add('show');

    // 4. Generate QR Code
    const qrContainer = document.getElementById('qrcode');
    qrContainer.innerHTML = "";
    new QRCode(qrContainer, {
      text: lastGeneratedKey,
      width: 140,
      height: 140
    });

    // 5. Cloud Auto-Sync with Google Sheets
    const syncBadge = document.getElementById('syncStatus');
    syncBadge.className = "status-badge status-syncing";
    syncBadge.innerText = "⏳ Saving to Sheet...";

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          action: "add_license",
          key: lastGeneratedKey,
          expiry: expiry,
          email: email,
          status: "ACTIVE"
        })
      });
      const data = await response.json();
      if (data.success) {
        syncBadge.className = "status-badge status-synced";
        syncBadge.innerText = "☁️ Auto-Saved to Sheet!";
      } else {
        syncBadge.className = "status-badge";
        syncBadge.innerText = "⚠️ " + (data.message || "Sync warning");
      }
    } catch (e) {
      syncBadge.className = "status-badge";
      syncBadge.innerText = "⚠️ Offline mode";
    }
  }

  function copyKey() {
    if (!lastGeneratedKey) return;
    navigator.clipboard.writeText(lastGeneratedKey).then(() => {
      alert("✓ License Key copied to clipboard!");
    });
  }

  function shareWhatsApp() {
    if (!lastGeneratedKey) return;
    const msg = encodeURIComponent(`Hello, here is your license key for Tally Master Tools:\n\n${lastGeneratedKey}\n\nPlease paste this into the Activate License window in the app.`);
    window.open(`https://api.whatsapp.com/send?text=${msg}`, '_blank');
  }
</script>

</body>
</html>
